name: RemindersAI
options:
  bundleIdPrefix: com.jimgreco
  deploymentTarget:
    iOS: "26.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 7.1.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V6JPQCD336
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GIT_COMMIT_HASH: ""
targets:
  RemindersAI:
    type: application
    platform: iOS
    sources:
      - path: RemindersAI
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.remindersai
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemindersAI/Info.plist
        API_BASE_URL: http://127.0.0.1:8792
        GOOGLE_CLIENT_ID: YOUR_GOOGLE_IOS_CLIENT_ID.apps.googleusercontent.com
        GOOGLE_REVERSED_CLIENT_ID: com.googleusercontent.apps.YOUR_GOOGLE_IOS_CLIENT_ID
        CODE_SIGN_ENTITLEMENTS: RemindersAI/RemindersAI.entitlements
        APS_ENVIRONMENT: development
        TARGETED_DEVICE_FAMILY: "1"
        # The Mac app is this target built with Mac Catalyst, in the Mac idiom.
        "TARGETED_DEVICE_FAMILY[sdk=macosx*]": "6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        "ENABLE_APP_SANDBOX[sdk=macosx*]": YES
        "ENABLE_OUTGOING_NETWORK_CONNECTIONS[sdk=macosx*]": YES
        "ENABLE_RESOURCE_ACCESS_CALENDARS[sdk=macosx*]": YES
        "ENABLE_RESOURCE_ACCESS_LOCATION[sdk=macosx*]": YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": "$(IOS_PROFILE_NAME)"
          # Set on the app target only: as a command-line setting it would also
          # reach the Swift package targets, which take no profile.
          "PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]": "$(MAC_PROFILE_NAME)"
    scheme:
      testTargets:
        - RemindersAITests
  RemindersAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemindersAITests
    dependencies:
      - target: RemindersAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.remindersai.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RemindersAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RemindersAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
