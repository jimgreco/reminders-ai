name: RemindersAI
options:
  bundleIdPrefix: com.jimgreco
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: V6JPQCD336
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GIT_COMMIT_HASH: ""
targets:
  RemindersAI:
    type: application
    platform: iOS
    sources:
      - path: RemindersAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.remindersai
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RemindersAI/Info.plist
        API_BASE_URL: http://127.0.0.1:8792
        CODE_SIGN_ENTITLEMENTS: RemindersAI/RemindersAI.entitlements
        APS_ENVIRONMENT: development
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          APS_ENVIRONMENT: production
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(IOS_PROFILE_NAME)"
    scheme:
      testTargets:
        - RemindersAITests
  RemindersAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RemindersAITests
    dependencies:
      - target: RemindersAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jimgreco.remindersai.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RemindersAI.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/RemindersAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
